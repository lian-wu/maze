<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze 2026 展示</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Maze 2026</h1>
        <p>使用與研究版相同的迷宮生成邏輯，支援尺寸、種子、難易度控制。</p>
      </header>

      <section class="panel">
        <div class="controls">
          <label>
            寬度（格）
            <input id="mazeWidth" type="number" min="10" max="80" value="30" />
          </label>
          <label>
            高度（格）
            <input id="mazeHeight" type="number" min="10" max="80" value="42" />
          </label>
          <label>
            種子
            <input id="seed" type="number" value="20260330" />
          </label>
          <button id="randomSeed" type="button">隨機種子</button>
          <label>
            難易度
            <select id="difficulty">
              <option value="easy">簡單</option>
              <option value="medium" selected>中等</option>
              <option value="hard">困難</option>
            </select>
          </label>
          <button id="generate" type="button">生成迷宮</button>
          <button id="printPage" type="button">列印</button>
        </div>

        <div class="meta" id="meta"></div>

        <div class="printArea">
          <div class="canvasWrap">
            <canvas id="mazeCanvas" width="1200" height="1200"></canvas>
          </div>
          <div class="printInfo" id="printInfo"></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
